name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
          - os: macos-latest
            args: --mac dmg zip
          - os: ubuntu-latest
            args: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install dmg-license (macOS only)
        if: runner.os == 'macOS'
        run: npm install dmg-license --no-save

      - name: Build packages
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml

      # 大文件偶发漏传，逐个体检并补传（最多 3 轮）
      - name: Verify assets and re-upload missing ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TAG="${GITHUB_REF_NAME}"
          for round in 1 2 3; do
            missing=0
            for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/latest*.yml; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$name"; then
                echo "::warning::missing $name, re-uploading (round $round)"
                gh release upload "$TAG" "$f" --clobber || missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "all assets present"
              exit 0
            fi
            sleep 15
          done
          echo "::error::some assets still missing after retries"
          exit 1
